name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build Release Binary
        run: |
          cd mac-athlon-agent
          swift --version
          swift build -c release --product AthlonAgent

      - name: Create App Bundle
        run: |
          chmod +x mac-athlon-agent/Scripts/package-macos-app.sh
          BUNDLE_DIR="${{ runner.temp }}/Athlon Agent.app"
          BUILD_DIR="$(pwd)/mac-athlon-agent/.build/release" \
            BUNDLE_DIR="${BUNDLE_DIR}" \
            mac-athlon-agent/Scripts/package-macos-app.sh
          echo "APP_BUNDLE=${BUNDLE_DIR}" >> $GITHUB_ENV

      - name: Verify App Bundle
        run: |
          APP="${{ env.APP_BUNDLE }}"
          test -x "${APP}/Contents/MacOS/AthlonAgent"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Contents/Info.plist")" = "AthlonAgent"
          test -d "${APP}/Contents/Resources/AthlonAgent_AthlonAgent.bundle"
          codesign --verify --deep --strict "${APP}"

      - name: Create DMG
        run: |
          APP_NAME="Athlon Agent"
          DMG_NAME="AthlonAgent"
          STAGING="${{ runner.temp }}/dmg_staging"

          mkdir -p "${STAGING}"
          cp -R "${{ env.APP_BUNDLE }}" "${STAGING}/"

          # Create symlink to /Applications
          ln -s /Applications "${STAGING}/Applications"

          hdiutil create \
            -volname "${DMG_NAME}" \
            -srcfolder "${STAGING}" \
            -ov \
            -format UDZO \
            "${{ runner.temp }}/${DMG_NAME}.dmg"

          echo "DMG_PATH=${{ runner.temp }}/${DMG_NAME}.dmg" >> $GITHUB_ENV

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AthlonAgent-macOS
          path: ${{ env.DMG_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.DMG_PATH }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
